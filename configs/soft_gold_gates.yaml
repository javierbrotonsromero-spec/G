# Previous version of the machine: rotating concrete sleeves on gold wires
# (closest to the reference contraption). Default layout is now 'rings'.
name: soft_gold_gates
output: renders/soft_gold_gates.mp4

machine:
  layout: gates
  orientation: -24
  pedestal:
    sink_radius: 0.62
timing:
  step_duration: 3.3
progression:
  label: "{pct}% Soft"
  softness: [0.0, 0.25, 0.5, 0.75, 1.0]
  materials: [gold]
