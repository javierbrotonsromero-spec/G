<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Duel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 20px system-ui, sans-serif; background: rgba(0,0,0,.55); cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="start">Click para empezar (R reinicia)</div>
<script>
// ---------------------------------------------------------------------------
// Ball Duel: two balls with spinning weapons fight inside an arena. Every hit
// makes the attacker's weapon stronger in its own way:
//   sword  -> +1 damage per hit
//   dagger -> spins 18% faster per hit
//   spear  -> grows longer per hit
//   hammer -> heavier knockback, +1 damage every 2 hits
// Weapons that touch parry (both reverse spin). Last ball standing wins.
// URL: ?a=sword&b=dagger&seed=N&hp=100
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const CONFIG = {
  seed: +(Q.get('seed') || 1), hp: +(Q.get('hp') || 100),
  W: 1080, H: 1920,
  arena: { x: 60, y: 420, w: 960, h: 960 },
  r: 68, gravity: 1100, topSpeed: 760, attract: +(Q.get('attract') || 1500),
  hitCooldown: 0.32, parryCooldown: 0.18, hitStop: 0.075,
  koSlow: 0.22, koSlowTime: 1.3, endHold: 2.4,
  teams: [
    { color: [255, 64, 96], weapon: Q.get('a') || 'sword' },
    { color: [60, 170, 255], weapon: Q.get('b') || 'dagger' },
  ],
  font: '"Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif',
};
const WEAPONS = {
  sword:  { len: 225, width: 18, spin: 3.4, dmg: 1, kick: 520 },
  dagger: { len: 150, width: 16, spin: 5.2, dmg: 1, kick: 420 },
  spear:  { len: 220, width: 10, spin: 2.8, dmg: 2, kick: 480 },
  hammer: { len: 190, width: 14, spin: 3.0, dmg: 3, kick: 900 },
};
function levelUp(b) {
  const w = b.w;
  if (w.type === 'sword') w.dmg += 1;
  else if (w.type === 'dagger') { w.spin = Math.min(w.spin * 1.2, 30); if (b.hits % 3 === 0) w.dmg += 1; }
  else if (w.type === 'spear') w.len = Math.min(w.len + 28, 600);
  else if (w.type === 'hammer') { w.kick += 120; if (b.hits % 2 === 0) w.dmg += 1; }
}
function statText(b) {
  const w = b.w;
  if (w.type === 'sword') return String(w.dmg);
  if (w.type === 'dagger') return (w.spin / WEAPONS.dagger.spin).toFixed(1) + 'x';
  if (w.type === 'spear') return String(Math.round(w.len));
  return String(w.dmg);
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let onHit = () => {}, onParry = () => {}, onWall = () => {}, onClash = () => {}, onKO = () => {};
let S;
function newSim() {
  const c = CONFIG, A = c.arena, rnd = mulberry32(c.seed);
  const balls = c.teams.map((t, i) => {
    const base = WEAPONS[t.weapon];
    const a = rnd() * 6.283;
    return {
      i, col: t.color, x: A.x + A.w * (i ? 0.72 : 0.28), y: A.y + A.h * (0.3 + 0.15 * rnd()),
      vx: (i ? -1 : 1) * (380 + 200 * rnd()), vy: -200 * rnd(),
      hp: c.hp, shown: c.hp, flash: 0, hits: 0, cd: 0, squash: 0,
      w: { type: t.weapon, len: base.len, width: base.width, spin: base.spin, dmg: base.dmg, kick: base.kick,
           ang: a, dir: i ? -1 : 1, trail: [] },
    };
  });
  return { rnd, t: 0, vt: 0, balls, parts: [], pops: [], rings: [], shake: 0, stop: 0, parryCd: 0,
           ko: -1, koT: 0, winner: -1, done: false, lead: [], pulse: 0 };
}
S = newSim();

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  const qx = ax + dx * u, qy = ay + dy * u; return [Math.hypot(px - qx, py - qy), qx, qy];
}
function weaponSeg(b) {
  const c = Math.cos(b.w.ang), s = Math.sin(b.w.ang), r0 = CONFIG.r * 0.55;
  return [b.x + c * r0, b.y + s * r0, b.x + c * (CONFIG.r + b.w.len), b.y + s * (CONFIG.r + b.w.len)];
}
function segSeg(a, b) {
  const d = Math.min(segDist(a[0], a[1], b[0], b[1], b[2], b[3])[0], segDist(a[2], a[3], b[0], b[1], b[2], b[3])[0],
                     segDist(b[0], b[1], a[0], a[1], a[2], a[3])[0], segDist(b[2], b[3], a[0], a[1], a[2], a[3])[0]);
  // proper intersection test
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  const A1 = [a[0], a[1]], A2 = [a[2], a[3]], B1 = [b[0], b[1]], B2 = [b[2], b[3]];
  if (o(A1, A2, B1) * o(A1, A2, B2) < 0 && o(B1, B2, A1) * o(B1, B2, A2) < 0) return 0;
  return d;
}
function burst(x, y, col, n, sp, life, size) {
  for (let k = 0; k < n; k++) {
    const a = S.rnd() * 6.283, v = sp * (0.3 + S.rnd());
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: life * (0.5 + S.rnd()), col, s: size * (0.5 + S.rnd()) });
  }
}
function fixSpeed(b) {
  // energy conservation with gravity: speed depends only on height
  const c = CONFIG, top = c.arena.y + c.r;
  const target = Math.sqrt(c.topSpeed * c.topSpeed + 2 * c.gravity * Math.max(0, b.y - top));
  const v = Math.hypot(b.vx, b.vy) || 1;
  const k = target / v; const m = 1 + (k - 1) * 0.08;  // relax towards target (keeps knockback visible)
  b.vx *= m; b.vy *= m;
}

function physics(dt) {
  const c = CONFIG, A = c.arena, [P, Q2] = S.balls;
  for (const b of S.balls) {
    if (b.hp <= 0) continue;
    b.vy += c.gravity * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    let wall = false;
    if (b.x < A.x + c.r) { b.x = A.x + c.r; b.vx = Math.abs(b.vx); wall = true; }
    if (b.x > A.x + A.w - c.r) { b.x = A.x + A.w - c.r; b.vx = -Math.abs(b.vx); wall = true; }
    if (b.y < A.y + c.r) { b.y = A.y + c.r; b.vy = Math.abs(b.vy); wall = true; }
    if (b.y > A.y + A.h - c.r) { b.y = A.y + A.h - c.r; b.vy = -Math.abs(b.vy); wall = true; }
    if (wall) {
      const a = (S.rnd() - 0.5) * 0.12, co = Math.cos(a), si = Math.sin(a);
      const vx = b.vx * co - b.vy * si; b.vy = b.vx * si + b.vy * co; b.vx = vx;
      b.squash = 1; onWall(b.i);
    }
    fixSpeed(b);
    b.w.ang += b.w.spin * b.w.dir * dt;
    b.cd = Math.max(0, b.cd - dt);
  }
  if (P.hp <= 0 || Q2.hp <= 0) return;
  { // gentle pull towards each other when far apart (keeps the fight dense)
    const dx = Q2.x - P.x, dy = Q2.y - P.y, d = Math.hypot(dx, dy) || 1;
    const a = c.attract * Math.max(0, d - 300) / 300 * dt;
    P.vx += dx / d * a; P.vy += dy / d * a; Q2.vx -= dx / d * a; Q2.vy -= dy / d * a;
  }
  // ball-ball
  const dx = Q2.x - P.x, dy = Q2.y - P.y, d = Math.hypot(dx, dy);
  if (d < 2 * c.r) {
    const nx = dx / d, ny = dy / d, ov = 2 * c.r - d;
    P.x -= nx * ov / 2; P.y -= ny * ov / 2; Q2.x += nx * ov / 2; Q2.y += ny * ov / 2;
    const rel = (Q2.vx - P.vx) * nx + (Q2.vy - P.vy) * ny;
    if (rel < 0) { P.vx += rel * nx; P.vy += rel * ny; Q2.vx -= rel * nx; Q2.vy -= rel * ny; onClash(); }
  }
  // parry
  S.parryCd = Math.max(0, S.parryCd - dt);
  const sa = weaponSeg(P), sb = weaponSeg(Q2);
  if (S.parryCd === 0 && segSeg(sa, sb) < (P.w.width + Q2.w.width) / 2) {
    P.w.dir *= -1; Q2.w.dir *= -1; S.parryCd = c.parryCooldown;
    const mx = (sa[2] + sb[2]) / 2, my = (sa[3] + sb[3]) / 2;
    burst(mx, my, [255, 230, 140], 26, 700, 0.35, 5);
    S.rings.push({ x: mx, y: my, t: 0, col: [255, 240, 180], R: 90 });
    S.shake = Math.max(S.shake, 8); S.stop = 0.04; onParry();
    return;
  }
  // hits
  for (const [att, def, seg] of [[P, Q2, sa], [Q2, P, sb]]) {
    if (att.cd > 0) continue;
    const [dist, qx, qy] = segDist(def.x, def.y, seg[0], seg[1], seg[2], seg[3]);
    if (dist < c.r + att.w.width / 2) {
      const dmg = att.w.dmg; def.hp = Math.max(0, def.hp - dmg); def.flash = 1;
      att.hits++; levelUp(att);
      att.cd = att.w.type === 'dagger' ? c.hitCooldown * WEAPONS.dagger.spin / att.w.spin : c.hitCooldown;
      let kx = def.x - att.x, ky = def.y - att.y; const kl = Math.hypot(kx, ky) || 1; kx /= kl; ky /= kl;
      def.vx = kx * att.w.kick + def.vx * 0.3; def.vy = ky * att.w.kick + def.vy * 0.3;
      burst(qx, qy, def.col, 22 + dmg * 3, 600 + dmg * 40, 0.5, 6);
      S.rings.push({ x: qx, y: qy, t: 0, col: def.col, R: 110 + dmg * 6 });
      S.pops.push({ x: qx, y: qy - 40, t: 0, txt: '-' + dmg, col: def.col, big: Math.min(1.8, 1 + dmg * 0.05) });
      S.shake = Math.max(S.shake, 10 + dmg * 1.6); S.stop = c.hitStop; S.pulse = 1;
      onHit(att.i, dmg, def.hp);
      const lead = Math.sign(S.balls[0].hp - S.balls[1].hp);
      if (lead && lead !== S.lead[S.lead.length - 1]) S.lead.push(lead);
      if (def.hp <= 0) {
        S.ko = def.i; S.winner = att.i; S.koT = 0;
        burst(def.x, def.y, def.col, 260, 1500, 1.4, 10);
        burst(def.x, def.y, [255, 255, 255], 80, 1100, 0.9, 6);
        S.rings.push({ x: def.x, y: def.y, t: 0, col: def.col, R: 700 });
        S.shake = 40; onKO(att.i);
      }
      return;
    }
  }
}

function tick(dt) {
  S.vt += dt;
  // effects always run in video time
  for (const b of S.balls) { b.flash *= Math.exp(-dt * 10); b.squash *= Math.exp(-dt * 12);
    b.shown += (b.hp - b.shown) * Math.min(1, dt * 6); }
  S.shake *= Math.exp(-dt * 9); S.pulse *= Math.exp(-dt * 7);
  let scale = 1;
  if (S.ko >= 0) { S.koT += dt; scale = S.koT < CONFIG.koSlowTime ? CONFIG.koSlow : 1; if (S.koT > CONFIG.koSlowTime + CONFIG.endHold) S.done = true; }
  const sdt = dt * scale;
  for (const p of S.parts) { p.t += sdt; p.x += p.vx * sdt; p.y += p.vy * sdt; p.vx *= Math.exp(-sdt * 3); p.vy *= Math.exp(-sdt * 3); p.vy += 600 * sdt; }
  S.parts = S.parts.filter(p => p.t < p.life);
  for (const r of S.rings) r.t += sdt; S.rings = S.rings.filter(r => r.t < 0.5);
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 0.8);
  if (S.stop > 0) { S.stop -= dt; return; }
  S.t += sdt;
  const n = 8; for (let k = 0; k < n; k++) physics(sdt / n);
  for (const b of S.balls) { b.w.trail.unshift(b.w.ang); if (b.w.trail.length > 6) b.w.trail.pop(); }
}

// ------------------------------------------------------------------ drawing
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, k) => c.map(v => Math.round(v + (255 - v) * k));
const dark = (c, k) => c.map(v => Math.round(v * k));

function drawWeapon(b, ang, alpha) {
  const c = CONFIG, w = b.w, r0 = c.r - 6, L = w.len;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang); ctx.globalAlpha = alpha;
  if (alpha === 1 && CONFIG.r > 20) { ctx.shadowColor = rgb(b.col, 0.9); ctx.shadowBlur = 22; }
  const W = w.width * (CONFIG.r > 20 ? 1.6 : 1);
  if (w.type === 'sword') {
    ctx.fillStyle = rgb(dark(b.col, 0.6)); ctx.fillRect(r0, -W * 1.3, 14, W * 2.6);       // guard
    const g = ctx.createLinearGradient(0, -W / 2, 0, W / 2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#c9d3e0'); g.addColorStop(1, '#7d8898');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(r0 + 14, -W / 2); ctx.lineTo(r0 + L - 26, -W / 2);
    ctx.lineTo(r0 + L, 0); ctx.lineTo(r0 + L - 26, W / 2); ctx.lineTo(r0 + 14, W / 2); ctx.fill();
  } else if (w.type === 'dagger') {
    ctx.fillStyle = rgb(dark(b.col, 0.6)); ctx.fillRect(r0, -W, 10, W * 2);
    ctx.fillStyle = '#e8eef6'; ctx.beginPath(); ctx.moveTo(r0 + 10, -W * 0.6); ctx.quadraticCurveTo(r0 + L * 0.7, -W * 0.7, r0 + L, 0);
    ctx.quadraticCurveTo(r0 + L * 0.7, W * 0.7, r0 + 10, W * 0.6); ctx.fill();
  } else if (w.type === 'spear') {
    ctx.fillStyle = '#b07a45'; ctx.fillRect(r0, -W / 2, L - 40, W);
    ctx.fillStyle = '#e8eef6'; ctx.beginPath(); ctx.moveTo(r0 + L - 46, -W * 1.6); ctx.lineTo(r0 + L, 0); ctx.lineTo(r0 + L - 46, W * 1.6); ctx.fill();
  } else {
    ctx.fillStyle = '#9a6a3c'; ctx.fillRect(r0, -W / 2, L - 30, W);
    ctx.fillStyle = '#d5dbe3'; ctx.fillRect(r0 + L - 46, -W * 2.6, 46, W * 5.2);
  }
  ctx.restore();
}

function drawBall(b) {
  const c = CONFIG, r = c.r;
  const sq = 1 + 0.12 * b.squash;
  ctx.save(); ctx.translate(b.x, b.y);
  const halo = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 1.8);
  halo.addColorStop(0, rgb(b.col, 0.45)); halo.addColorStop(1, rgb(b.col, 0));
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, r * 1.8, 0, 6.283); ctx.fill();
  ctx.scale(sq, 1 / sq);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, rgb(mix(b.col, 0.55))); g.addColorStop(0.6, rgb(b.col)); g.addColorStop(1, rgb(dark(b.col, 0.45)));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  if (b.flash > 0.02) { ctx.fillStyle = `rgba(255,255,255,${b.flash})`; ctx.fill(); }
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
  ctx.font = `900 ${b.hp >= 100 ? 50 : 58}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.strokeText(String(b.hp), 0, 3);
  ctx.fillStyle = '#fff'; ctx.fillText(String(b.hp), 0, 3);
  ctx.restore();
}

function drawCrown(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#ffd34d'; ctx.strokeStyle = '#a8740a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-50, 20); ctx.lineTo(-56, -30); ctx.lineTo(-25, -5); ctx.lineTo(0, -42);
  ctx.lineTo(25, -5); ctx.lineTo(56, -30); ctx.lineTo(50, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
  for (const px of [-56, 0, 56]) { ctx.fillStyle = rgb(col); ctx.beginPath(); ctx.arc(px, px ? -30 : -42, 8, 0, 6.283); ctx.fill(); }
  ctx.restore();
}

function drawIcon(type, x, y, col) {
  // small weapon icon for the stat panel
  const fake = { x, y, col, w: { type, len: type === 'dagger' ? 60 : 84, width: type === 'spear' ? 7 : 11 } };
  const saved = CONFIG.r; CONFIG.r = 6;
  drawWeapon(fake, -Math.PI / 4, 1); CONFIG.r = saved;
}

function draw() {
  const c = CONFIG, A = c.arena;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, c.H);
  bg.addColorStop(0, '#12101c'); bg.addColorStop(1, '#05050a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, c.W, c.H);
  // side glow by who is winning
  const [P, Q2] = S.balls;
  const lg = ctx.createLinearGradient(0, 0, c.W, 0);
  lg.addColorStop(0, rgb(P.col, 0.10 + 0.18 * (P.shown / c.hp))); lg.addColorStop(0.5, 'rgba(0,0,0,0)');
  lg.addColorStop(1, rgb(Q2.col, 0.10 + 0.18 * (Q2.shown / c.hp)));
  ctx.fillStyle = lg; ctx.fillRect(0, 0, c.W, c.H);

  const sh = S.shake, ox = (Math.sin(S.vt * 91) + Math.sin(S.vt * 57)) * sh * 0.5, oy = (Math.cos(S.vt * 77) + Math.sin(S.vt * 43)) * sh * 0.5;
  const z = 1 + 0.012 * S.pulse;
  ctx.setTransform(z, 0, 0, z, ox + (1 - z) * c.W / 2, oy + (1 - z) * (A.y + A.h / 2));
  // arena
  ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fillRect(A.x, A.y, A.w, A.h);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  for (let k = 1; k < 8; k++) { ctx.beginPath(); ctx.moveTo(A.x + A.w * k / 8, A.y); ctx.lineTo(A.x + A.w * k / 8, A.y + A.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(A.x, A.y + A.h * k / 8); ctx.lineTo(A.x + A.w, A.y + A.h * k / 8); ctx.stroke(); }
  ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.strokeRect(A.x - 4, A.y - 4, A.w + 8, A.h + 8);

  // weapons with motion trail, then balls
  for (const b of S.balls) {
    if (b.hp <= 0) continue;
    // swoosh: filled wedge swept by the blade over the last frames
    const tr = b.w.trail; if (tr.length > 1) {
      const a0 = tr[0], a1 = tr[tr.length - 1], r1 = CONFIG.r + 10, r2 = CONFIG.r + b.w.len;
      const g = ctx.createRadialGradient(b.x, b.y, r1, b.x, b.y, r2);
      g.addColorStop(0, rgb(b.col, 0)); g.addColorStop(1, rgb(mix(b.col, 0.4), 0.45));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, r2, Math.min(a0, a1), Math.max(a0, a1));
      ctx.arc(b.x, b.y, r1, Math.max(a0, a1), Math.min(a0, a1), true); ctx.fill();
    }
    drawWeapon(b, b.w.ang, 1);
  }
  for (const b of S.balls) if (b.hp > 0) drawBall(b);
  // effects
  ctx.globalCompositeOperation = 'lighter';
  for (const r of S.rings) { const k = r.t / 0.5; ctx.lineWidth = 16 * (1 - k) + 1; ctx.strokeStyle = rgb(r.col, 0.9 * (1 - k));
    ctx.beginPath(); ctx.arc(r.x, r.y, r.R * Math.sqrt(k) + 10, 0, 6.283); ctx.stroke(); }
  for (const p of S.parts) { const a = 1 - p.t / p.life; ctx.fillStyle = rgb(p.col, a); ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of S.pops) {
    const k = p.t / 0.8, s = p.big * (k < 0.12 ? 0.6 + 4 * k : 1);
    ctx.save(); ctx.translate(p.x, p.y - 90 * k); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, (1 - k) * 2.5);
    ctx.font = `900 64px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.strokeText(p.txt, 0, 0);
    ctx.fillStyle = rgb(mix(p.col, 0.25)); ctx.fillText(p.txt, 0, 0); ctx.restore();
  }
  if (S.winner >= 0) {
    const wb = S.balls[S.winner], k = Math.min(1, S.koT / 0.6);
    const bob = Math.sin(S.vt * 6) * 6;
    drawCrown(wb.x, wb.y - c.r - 50 + bob, 0.4 + 0.6 * (1 - Math.pow(1 - k, 3)), wb.col);
  }

  // HUD: HP bars (top) + weapon stats (bottom)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bw = 430, bh = 54, by = 230;
  S.balls.forEach((b, i) => {
    const x = i ? c.W - 60 - bw : 60, f = Math.max(0, b.shown / c.hp);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, by, bw, bh);
    ctx.fillStyle = rgb(b.col); const fw = bw * f;
    ctx.fillRect(i ? x + bw - fw : x, by, fw, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(i ? x + bw - fw : x, by, fw, bh * 0.35);
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeRect(x, by, bw, bh);
    ctx.font = `900 92px ${c.font}`; ctx.textAlign = i ? 'right' : 'left'; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 12; ctx.strokeStyle = '#000'; const hx = i ? x + bw : x;
    ctx.strokeText(String(b.hp), hx, by - 22); ctx.fillStyle = rgb(mix(b.col, 0.3)); ctx.fillText(String(b.hp), hx, by - 22);
    // stats
    const sx = i ? c.W - 300 : 80, sy = 1490;
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.roundRect(sx, sy, 220, 130, 26); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = rgb(b.col, 0.9); ctx.stroke();
    drawIcon(b.w.type, sx + 26, sy + 98, b.col);
    ctx.font = `900 64px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 58px ${c.font}`; ctx.fillStyle = '#fff'; ctx.fillText(statText(b), sx + 148, sy + 68);
  });
  // VS badge
  ctx.font = `900 60px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.strokeText('VS', c.W / 2, by + bh / 2 - 30);
  ctx.fillStyle = '#ffd34d'; ctx.fillText('VS', c.W / 2, by + bh / 2 - 30);
  if (S.ko >= 0 && S.koT < 0.25) { ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - S.koT / 0.25)})`; ctx.fillRect(0, 0, c.W, c.H); }
}

// ------------------------------------------------------------- live sound
let AC = null;
function tone(f, d, type = 'square', v = 0.15) { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); }
let last = 0, acc = 0;
function loop(ts) { if (!last) last = ts; acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  while (acc >= 1 / 60) { tick(1 / 60); acc -= 1 / 60; } draw(); requestAnimationFrame(loop); }
document.getElementById('start').onclick = (e) => { e.target.remove(); AC = new AudioContext();
  onHit = (i, d) => tone(160 + d * 10, 0.18, 'sawtooth', 0.25); onParry = () => tone(1800, 0.2, 'triangle', 0.2);
  onWall = () => tone(300, 0.05, 'sine', 0.08); onKO = () => tone(60, 1.2, 'sawtooth', 0.4); requestAnimationFrame(loop); };
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') S = newSim(); });
draw();
window.__sim = () => S; window.__tick = tick; window.__draw = draw;
</script>
