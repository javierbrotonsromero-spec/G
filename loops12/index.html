<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; font: 20px system-ui, sans-serif; background: rgba(0,0,0,.55); cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="start">Click para empezar<br><small>?mode=gates|split|morph|shrink|wall|orbit|pendulum|poly|galton|corner|chain|paint&amp;seed=N · R reinicia</small></div>
<script>
// ---------------------------------------------------------------------------
// Loop Lab: 12 different loop formats sharing one engine (plain balls that
// change colour on every bounce, particles, slow-motion, HUD, sound events).
// Two loop techniques:
//   - flash seam: the video ends on a white flash after the finale and opens
//     on the same flash + explosion (gates, split, morph, shrink, wall, orbit,
//     galton, corner, chain, paint)
//   - exact seam: the motion is periodic and returns to frame 0 (pendulum, poly)
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'gates';
const SEED = +(Q.get('seed') || 1);
const W = 1080, H = 1920, CY = 1000;
const FONT = '"Montserrat", "Arial Black", "Helvetica Neue", Arial, sans-serif';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TAU = Math.PI * 2;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

// --------------------------------------------------------------- engine state
let S, EV = [];
let liveSound = null;
function ev(type, a = 0, b = 0) { EV.push([type, +S.vt.toFixed(4), a, b]); if (liveSound) liveSound(type, a, b); }
function burst(x, y, n, sp, life, size, hue) {
  for (let i = 0; i < n; i++) { const a = S.rnd() * TAU, v = sp * (0.25 + S.rnd());
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: life * (0.5 + S.rnd()), hue: hue == null ? S.rnd() * 360 : hue, s: size * (0.5 + S.rnd()) }); }
}
function ring(x, y, R, hue, w = 1) { S.rings.push({ x, y, R, hue, w, t: 0 }); }
function slow(time, scale) { S.slowT = time; S.slowScale = scale; }
function nextHue() { S.hue = (S.hue + 47) % 360; return S.hue; }
function finish(x = 0, y = 0, scale = 1) {
  if (S.endT >= 0) return;
  S.endT = S.vt; S.shake = 34; slow(0.45, 0.3);
  burst(x, y, 500, 2200 * scale, 1.5, 14 * scale, null); ring(x, y, 1600 * scale, 0, 2);
  ev('F');
}
function drawBall(x, y, r, hue, glow = 2.4) {
  const g = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * glow);
  g.addColorStop(0, hsl(hue, 100, 60, 0.55)); g.addColorStop(1, hsl(hue, 100, 60, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * glow, 0, TAU); ctx.fill();
  ctx.fillStyle = hsl(hue, 100, 60); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
// reflect a ball off a segment (with optional wall velocity); returns contact info or null
function segHit(b, x1, y1, x2, y2, r, wvx = 0, wvy = 0) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  const u = Math.max(0, Math.min(1, ((b.x - x1) * dx + (b.y - y1) * dy) / l2));
  const qx = x1 + dx * u, qy = y1 + dy * u; let nx = b.x - qx, ny = b.y - qy; const d = Math.hypot(nx, ny);
  if (d >= r || d === 0) return null;
  nx /= d; ny /= d; b.x = qx + nx * r; b.y = qy + ny * r;
  const rvx = b.vx - wvx, rvy = b.vy - wvy, vn = rvx * nx + rvy * ny;
  if (vn >= 0) return null;
  b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; return { x: qx, y: qy, u };
}
function jitter(b, amt) { const a = (S.rnd() - 0.5) * amt; [b.vx, b.vy] = rot(b.vx, b.vy, a); }
function setSpeed(b, v) { const s = Math.hypot(b.vx, b.vy) || 1; b.vx *= v / s; b.vy *= v / s; }

// =============================================================== the 12 modes
const MODES = {};

// 1 ─ GATES: rings made of rotating barrier arcs, ball escapes outward
MODES.gates = {
  init(M) { M.rings = []; const G = [46, 38, 31, 26, 22];
    for (let k = 0; k < 5; k++) M.rings.push({ R: 120 + 82 * k, th: 14, gap: G[k] * Math.PI / 180, ang: S.rnd() * TAU, w: (1.1 + 0.3 * k) * (k % 2 ? -1 : 1), alive: true, hue: (200 + k * 50) % 360 });
    const a = S.rnd() * TAU; M.b = { x: 0, y: 0, vx: Math.cos(a) * 820, vy: Math.sin(a) * 820, r: 12 }; M.lastNear = -9; M.lastP = -1; M.done = 0; S.z = 2.3; },
  step(M, dt) { const b = M.b; b.x += b.vx * dt; b.y += b.vy * dt;
    const d = Math.hypot(b.x, b.y), A = Math.atan2(b.y, b.x);
    for (const R of M.rings) { if (!R.alive) continue; R.ang += R.w * dt; }
    for (const R of M.rings) { if (!R.alive) continue;
      const span = TAU / 3, arc = span - R.gap, rel = ((A - R.ang) % span + span) % span;
      if (Math.abs(d - R.R) < b.r + R.th / 2) {
        if (rel < arc) { const s = Math.sign(d - R.R) || 1, nx = b.x / d * s, ny = b.y / d * s;
          const tx = -b.y / d, ty = b.x / d, wv = R.w * R.R;
          const vn = b.vx * nx + b.vy * ny; if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; b.vx += tx * wv * 0.15; b.vy += ty * wv * 0.15;
            jitter(b, 0.06); setSpeed(b, 820 * (1 + 0.05 * M.done)); const r = R.R + s * (b.r + R.th / 2); b.x = b.x / d * r; b.y = b.y / d * r;
            nextHue(); S.pulse = 1; burst(b.x - nx * b.r, b.y - ny * b.r, 8, 300, 0.3, 5, S.hue); if (S.vt - M.lastP > 0.04) { M.lastP = S.vt; ev('p', S.count++ % 10, M.done); } }
        }
      }
      // arc end caps (the edges of each gap) -> near misses
      if (rel >= arc && Math.abs(d - R.R) < b.r + R.th) for (let j = 0; j < 3; j++) for (const e of [0, 1]) {
        const ea = R.ang + j * span + (e ? span - R.gap : 0) + (e ? 0 : 0), cx = Math.cos(ea) * R.R, cy = Math.sin(ea) * R.R;
        const hit = segHit(b, cx, cy, cx + 0.01, cy, b.r + R.th / 2);
        if (hit) { nextHue(); setSpeed(b, 820 * (1 + 0.05 * M.done));
          if (S.vt - M.lastNear > 0.8) { M.lastNear = S.vt; slow(0.18, 0.3); ring(cx, cy, 90, 0, 0.5); ev('t'); } else if (S.vt - M.lastP > 0.04) { M.lastP = S.vt; ev('p', S.count++ % 10, M.done); } }
      }
    }
    const cur = M.rings.find(R => R.alive);
    if (cur && d > cur.R + b.r + cur.th) { cur.alive = false; M.done++;
      for (let k = 0; k < 60; k++) { const a = S.rnd() * TAU; S.parts.push({ x: Math.cos(a) * cur.R, y: Math.sin(a) * cur.R, vx: Math.cos(a) * (300 + S.rnd() * 900), vy: Math.sin(a) * (300 + S.rnd() * 900), t: 0, life: 0.8, hue: cur.hue, s: 9 }); }
      ring(0, 0, cur.R * 2.2, cur.hue, 1.5); S.shake = 18; S.pop = 1; ev('k', M.done / 5); slow(0.15, 0.4);
      if (!M.rings.some(R => R.alive)) finish(b.x, b.y, 0.6); }
    const nxt = M.rings.find(R => R.alive); S.zTarget = nxt ? Math.min(2.3, 400 / (nxt.R + 30)) : 0.9;
    S.left = M.rings.filter(R => R.alive).length; S.prog = M.done / 5; },
  draw(M) { const px = 1 / S.zc;
    for (const R of M.rings) { if (!R.alive) continue; const span = TAU / 3;
      for (const [w, a] of [[R.th * 2.4, 0.2], [R.th, 1]]) { ctx.lineWidth = w; ctx.strokeStyle = hsl(R.hue, 100, 62, a); ctx.lineCap = 'round';
        for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(0, 0, R.R, R.ang + j * span, R.ang + j * span + span - R.gap); ctx.stroke(); } } }
    if (S.endT < 0) drawBall(M.b.x, M.b.y, M.b.r, S.hue); },
};

// 2 ─ SPLIT: one ball splits on its bounces until 256 balls fill the circle
MODES.split = {
  init(M) { M.R = 470; const a = S.rnd() * TAU; M.balls = [{ x: 0, y: 0, vx: Math.cos(a) * 760, vy: Math.sin(a) * 760, age: 0, hue: 200 }]; M.cap = 256; M.lastP = -1; S.z = 1; },
  step(M, dt) { const R = M.R, r = 12, add = [];
    for (const b of M.balls) { b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt; const d = Math.hypot(b.x, b.y);
      if (d > R - r) { const nx = b.x / d, ny = b.y / d, vn = b.vx * nx + b.vy * ny; b.x = nx * (R - r); b.y = ny * (R - r);
        if (vn > 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; jitter(b, 0.1); b.hue = (b.hue + 47) % 360;
          if (S.vt - M.lastP > 0.045) { M.lastP = S.vt; ev('p', Math.floor(Math.log2(M.balls.length)) + (S.count++ % 3), 0); }
          if (S.rnd() < 0.5) burst(b.x, b.y, 3, 200, 0.25, 4, b.hue);
          if (b.age > 1.05 && M.balls.length + add.length < M.cap) { b.age = 0; const c = { ...b }; [b.vx, b.vy] = rot(b.vx, b.vy, 0.32); [c.vx, c.vy] = rot(c.vx, c.vy, -0.32); c.hue = (c.hue + 180) % 360; add.push(c); } } } }
    if (add.length) { const before = M.balls.length; M.balls.push(...add);
      if (Math.floor(Math.log2(M.balls.length)) > Math.floor(Math.log2(before))) { S.pop = 1; ring(0, 0, M.R * 1.2, S.hue, 1); ev('k', Math.log2(M.balls.length) / 8); nextHue(); } }
    S.left = M.balls.length; S.prog = Math.log2(M.balls.length) / 8;
    if (M.balls.length >= M.cap && S.endT < 0) { M.full = (M.full || 0) + dt; if (M.full > 0.6) finish(0, 0, 0.8); } },
  draw(M) { ctx.lineWidth = 10; ctx.strokeStyle = hsl(S.hue, 100, 70, 0.9); ctx.beginPath(); ctx.arc(0, 0, M.R + 5, 0, TAU); ctx.stroke();
    if (S.endT >= 0) return; for (const b of M.balls) { ctx.fillStyle = hsl(b.hue, 100, 60); ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, TAU); ctx.fill(); } },
};

// 3 ─ MORPH: gravity ball in a spinning polygon that gains a side on every bounce
MODES.morph = {
  init(M) { M.n = 3; M.R = 450; M.ang = S.rnd() * TAU; M.w = 0.8; M.b = { x: 0, y: -60, vx: 420 * (S.rnd() < 0.5 ? 1 : -1), vy: 0, r: 30 }; M.max = 26; S.z = 1; },
  verts(M) { const out = []; for (let i = 0; i < M.n; i++) { const a = M.ang + i * TAU / M.n - Math.PI / 2; out.push([Math.cos(a) * M.R, Math.sin(a) * M.R]); } return out; },
  step(M, dt) { const b = M.b; M.ang += M.w * dt; b.vy += 2300 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    const V = this.verts(M);
    for (let i = 0; i < V.length; i++) { const A = V[i], B = V[(i + 1) % V.length], mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, ml = Math.hypot(mx, my);
      const nx = -mx / ml, ny = -my / ml, dist = (b.x - A[0]) * nx + (b.y - A[1]) * ny;
      if (dist >= b.r) continue;
      b.x += nx * (b.r - dist); b.y += ny * (b.r - dist);
      const wvx = -M.w * b.y, wvy = M.w * b.x, vn = (b.vx - wvx) * nx + (b.vy - wvy) * ny;
      if (vn >= 0) continue;
      b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
      const sp = Math.hypot(b.vx, b.vy); setSpeed(b, Math.max(1050, Math.min(1700, sp))); jitter(b, 0.05);
      const hx = b.x - nx * b.r, hy = b.y - ny * b.r;
      nextHue(); S.pulse = 1; burst(hx, hy, 12, 380, 0.35, 6, S.hue); ev('p', M.n, 0);
      if (M.n < M.max) { M.n++; M.w = Math.min(4.5, Math.abs(M.w) * 1.07) * (M.n % 5 === 0 ? -Math.sign(M.w) : Math.sign(M.w)); if (M.n % 5 === 0) { ring(0, 0, M.R * 1.3, S.hue, 1); S.pop = 1; ev('k', M.n / M.max); } }
      else if (S.endT < 0) finish(b.x, b.y, 0.8);
      break; }
    S.left = M.n; S.prog = (M.n - 3) / (M.max - 3); },
  draw(M) { const V = this.verts(M);
    if (S.endT < 0) { for (const [w, a] of [[34, 0.22], [14, 1]]) { ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.strokeStyle = hsl((S.hue + 180) % 360, 100, 65, a);
      ctx.beginPath(); V.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); }
      drawBall(M.b.x, M.b.y, M.b.r, S.hue); } },
};

// 4 ─ SHRINK: two balls in a circle that shrinks every time they collide
MODES.shrink = {
  init(M) { M.R = 490; M.R0 = 490; M.r = 34; M.balls = [0, 1].map(i => { const a = S.rnd() * TAU; return { x: i ? 160 : -160, y: 0, vx: Math.cos(a) * 900, vy: Math.sin(a) * 900, hue: i ? 20 : 200 }; }); S.z = 1; },
  step(M, dt) { const r = M.r;
    for (const b of M.balls) { b.x += b.vx * dt; b.y += b.vy * dt; const d = Math.hypot(b.x, b.y);
      if (d > M.R - r) { const nx = b.x / d, ny = b.y / d, vn = b.vx * nx + b.vy * ny; b.x = nx * (M.R - r); b.y = ny * (M.R - r);
        if (vn > 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; jitter(b, 0.12); b.hue = (b.hue + 47) % 360; M.R *= 0.99; S.count++;
          burst(b.x + nx * r, b.y + ny * r, 8, 300, 0.3, 5, b.hue); ev('p', S.count % 10, 0); } } }
    const [P, Q2] = M.balls, dx = Q2.x - P.x, dy = Q2.y - P.y, d = Math.hypot(dx, dy);
    if (d < 2 * r && d > 0) { const nx = dx / d, ny = dy / d, ov = (2 * r - d) / 2; P.x -= nx * ov; P.y -= ny * ov; Q2.x += nx * ov; Q2.y += ny * ov;
      const rel = (Q2.vx - P.vx) * nx + (Q2.vy - P.vy) * ny;
      if (rel < 0) { P.vx += rel * nx; P.vy += rel * ny; Q2.vx -= rel * nx; Q2.vy -= rel * ny; M.R *= 0.94; if (S.vt - (M.lastK || -1) < 0.12) return; M.lastK = S.vt; S.pop = 1; S.shake = 14;
        burst((P.x + Q2.x) / 2, (P.y + Q2.y) / 2, 40, 700, 0.6, 8, null); ring((P.x + Q2.x) / 2, (P.y + Q2.y) / 2, 260, S.hue, 1); nextHue(); ev('k', 1 - (M.R - 2.4 * r) / (M.R0 - 2.4 * r)); slow(0.1, 0.35); } }
    for (const b of M.balls) setSpeed(b, 900 * (1 + 0.6 * (1 - M.R / M.R0)));
    S.left = Math.round(M.R / M.R0 * 100); S.prog = 1 - (M.R - 2.4 * r) / (M.R0 - 2.4 * r);
    if (M.R < 2.4 * r && S.endT < 0) finish(0, 0, 0.8); },
  draw(M) { if (S.endT >= 0) return; ctx.lineWidth = 14; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, M.R + 7, 0, TAU); ctx.stroke();
    ctx.lineWidth = 36; ctx.strokeStyle = hsl(S.hue, 100, 60, 0.25); ctx.stroke();
    for (const b of M.balls) drawBall(b.x, b.y, M.r, b.hue); },
};

// 5 ─ WALL: rings of bricks; every 15 bricks the ball splits (up to 6 balls)
MODES.wall = {
  init(M) { M.bricks = []; const L = [[270, 20], [330, 26], [390, 32]];
    L.forEach(([R, n], li) => { for (let i = 0; i < n; i++) M.bricks.push({ r0: R, r1: R + 48, a0: i * TAU / n + 0.012, a1: (i + 1) * TAU / n - 0.012, hue: (li * 70 + i * 9) % 360, alive: true }); });
    M.total = M.bricks.length; M.Rout = 480; const a = S.rnd() * TAU; M.balls = [{ x: 0, y: 0, vx: Math.cos(a) * 1100, vy: Math.sin(a) * 1100, hue: 200 }]; M.broken = 0; S.z = 1; },
  step(M, dt) { const r = 16;
    for (const b of M.balls) { const px = b.x, py = b.y; b.x += b.vx * dt; b.y += b.vy * dt;
      const d = Math.hypot(b.x, b.y);
      if (d > M.Rout - r) { const nx = b.x / d, ny = b.y / d, vn = b.vx * nx + b.vy * ny; b.x = nx * (M.Rout - r); b.y = ny * (M.Rout - r);
        if (vn > 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; jitter(b, 0.1); b.hue = (b.hue + 47) % 360; ev('p', S.count++ % 5, 0); } }
      const A = (Math.atan2(b.y, b.x) + TAU) % TAU;
      for (const k of M.bricks) { if (!k.alive) continue;
        const da = r / Math.max(d, 1);
        if (d > k.r0 - r && d < k.r1 + r && A > k.a0 - da && A < k.a1 + da) {
          k.alive = false; M.broken++; const pd = Math.hypot(px, py), pa = (Math.atan2(py, px) + TAU) % TAU;
          if (pd <= k.r0 - r + 1 || pd >= k.r1 + r - 1) { const nx = b.x / d, ny = b.y / d, vn = b.vx * nx + b.vy * ny; b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
          else { const tx = -b.y / d, ty = b.x / d, vt = b.vx * tx + b.vy * ty; b.vx -= 2 * vt * tx; b.vy -= 2 * vt * ty; }
          b.x = px; b.y = py; b.hue = (b.hue + 47) % 360; nextHue(); S.pulse = 1;
          const am = (k.a0 + k.a1) / 2, rm = (k.r0 + k.r1) / 2; burst(Math.cos(am) * rm, Math.sin(am) * rm, 16, 500, 0.5, 8, k.hue); ev('p', 5 + (M.broken % 7), 1);
          if (M.broken % 11 === 0 && M.balls.length < 7) { const c = { ...b }; [c.vx, c.vy] = rot(b.vx, b.vy, 0.8); M.balls.push(c); ring(b.x, b.y, 200, S.hue, 1); S.pop = 1; ev('k', M.balls.length / 6); }
          break; } }
      setSpeed(b, 1100 + 6 * M.broken); }
    S.left = M.total - M.broken; S.prog = M.broken / M.total;
    if (M.broken >= M.total && S.endT < 0) finish(0, 0, 0.8); },
  draw(M) { ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(0, 0, M.Rout + 4, 0, TAU); ctx.stroke();
    for (const k of M.bricks) { if (!k.alive) continue; ctx.fillStyle = hsl(k.hue, 90, 58); ctx.beginPath(); ctx.arc(0, 0, k.r1, k.a0, k.a1); ctx.arc(0, 0, k.r0, k.a1, k.a0, true); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(0, 0, k.r1, k.a0, k.a1); ctx.arc(0, 0, k.r1 - 10, k.a1, k.a0, true); ctx.closePath(); ctx.fill(); }
    if (S.endT < 0) for (const b of M.balls) drawBall(b.x, b.y, 16, b.hue); },
};

// 6 ─ ORBIT: balls launched into orbit draw spirographs, then spiral into the sun
MODES.orbit = {
  init(M) { M.GM = 1.7e8; M.balls = []; M.next = 0.2; M.n = 0; M.max = 9; M.sun = 34; S.z = 1; },
  step(M, dt) {
    if (M.n < M.max && S.t >= M.next) { const k = M.n, a = k * 2.4 + 0.5, R = 440;
      const vc = Math.sqrt(M.GM / R) * (0.62 + 0.3 * S.rnd());
      M.balls.push({ x: Math.cos(a) * R, y: Math.sin(a) * R, vx: -Math.sin(a) * vc, vy: Math.cos(a) * vc, hue: (k * 40 + 190) % 360, trail: [], vr: 0, alive: true });
      M.n++; M.next += 1.05; ring(Math.cos(a) * R, Math.sin(a) * R, 120, S.hue, 0.6); ev('k', 0.15 + 0.05 * k); }
    const drag = S.t > M.max * 1.05 + 0.6 ? Math.min(2.2, (S.t - M.max * 1.05 - 0.6) * 1.4) : 0;
    for (const b of M.balls) { if (!b.alive) continue;

// 10 ─ CORNER: the DVD question — will it hit the corner? (it does, exactly at the end)

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function draw() {

}

// ------------------------------------------------------------- live sound
let AC = null;
function tone(f, d, type = 'triangle', v = 0.12) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); }

document.getElementById('start').onclick = (e) => { e.target.remove(); AC = new AudioContext();

    else if (t === 't') tone(2600, 0.3, 'sine', 0.15); else if (t === 'k') tone(70, 0.5, 'sawtooth', 0.25); else if (t === 'F') tone(45, 1.2, 'sawtooth', 0.4); };
